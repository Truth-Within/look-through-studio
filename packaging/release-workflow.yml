# Builds all three desktop/mobile artifacts on every release tag (git tag v1.x && git push --tags):
#   - LookThroughStudio.exe      (Windows, pyinstaller)
#   - lookthrough-studio         (Linux x86_64 AppImage-style single file, pyinstaller)
#   - app-release.apk            (Android, gradle)
# Each job also runs the pipeline's demo job as a smoke test.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python packaging/make_icons.py
      - run: pyinstaller packaging/studio-windows.spec --clean --noconfirm
      - uses: actions/upload-artifact@v4
        with: { name: LookThroughStudio.exe, path: dist/LookThroughStudio.exe }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python packaging/make_icons.py
      - run: pyinstaller packaging/studio-linux.spec --clean --noconfirm
      - run: python3 tests/run_battery.py
      - run: python3 main.py --demo -y
      - uses: actions/upload-artifact@v4
        with: { name: lookthrough-studio-linux-x86_64, path: dist/lookthrough-studio }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: python3 packaging/make_icons.py
      # The signing keystore is a repo secret (base64). If unset, the APK is built unsigned.
      - name: Decode signing keystore (if secret set)
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/lookthrough.keystore
      - run: cd android && gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: LookThroughStudio.apk, path: android/app/build/outputs/apk/release/app-release.apk }
